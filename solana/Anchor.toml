# Anchor 0.30.1 + Solana 1.18.26 CANNOT BUILD. Every current
# switchboard-on-demand release requires solana-program >=2, and anchor-lang
# 0.30.1 requires ~1.18 — the two are mutually exclusive. Moved to Anchor 0.31.x,
# which targets Solana 2.x. See programs/wallet-wars/Cargo.toml for the exact
# solana-program pin and why it is required.
[toolchain]
anchor_version = "0.31.1"
solana_version = "2.2.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
kings_bag = "KBagXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
wallet_wars = "71dQZy3UiFyTj84Z9cYUxndzsRutE1isWS47eyNs1Mfh"

[programs.devnet]
kings_bag = "KBagXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
wallet_wars = "71dQZy3UiFyTj84Z9cYUxndzsRutE1isWS47eyNs1Mfh"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["programs/kings-bag", "programs/wallet-wars"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./yoink.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08080f" />
    <!--
      TITLE / DESCRIPTION describe WALLET WARS, not The Bag.
      The Bag is gated off behind BAG_COMING_SOON, so naming it here advertised a
      game nobody can reach on the single line every visitor and every crawler
      reads first.
    -->
    <meta
      name="description"
      content="Wallet Wars on Solana. Deploy SOL and earn a toll from every siege that fails against you, or pay a small fee to crack someone else's vault. Published odds, provably fair rolls, free to play."
    />
    <title>YOINK.GG · Wallet Wars — be the house</title>

    <!--
      ── LINK PREVIEWS (Open Graph + Twitter) ────────────────────────────────
      Without these, every challenge link and referral link the app generates
      renders as a bare grey URL on Twitter, Telegram, Discord and iMessage —
      which guts the click-through of the exact growth loops the product is
      built around. A shareable product with no preview card is a shop with no
      sign.

      og:image MUST be an absolute URL — crawlers do not resolve the relative
      `base: "./"` the app itself uses. Update the two absolute URLs below if the
      site moves to a custom domain.

      public/og.png is generated from scripts/og-card.html via scripts/make-og.sh
      (headless screenshot, verified to be exactly 1200x630) so it can be edited
      and re-derived rather than being an opaque binary.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YOINK.GG" />
    <meta property="og:title" content="Wallet Wars — in every other app the house wins" />
    <meta
      property="og:description"
      content="Here you can be the house. Deploy SOL and earn a toll from every failed siege, or crack someone else's vault. Published odds, provably fair, free to play."
    />
    <meta property="og:url" content="https://youssefalw2001.github.io/Yoink.gg/" />
    <meta property="og:image" content="https://youssefalw2001.github.io/Yoink.gg/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WALLET WARS — in every other app the house wins. Here you can be the house." />

    <!-- summary_large_image gives the full-width card; `summary` would crop to a thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wallet Wars — in every other app the house wins" />
    <meta
      name="twitter:description"
      content="Here you can be the house. Published odds, provably fair rolls, free to play on Solana."
    />
    <meta name="twitter:image" content="https://youssefalw2001.github.io/Yoink.gg/og.png" />
    <meta name="twitter:image:alt" content="WALLET WARS — in every other app the house wins. Here you can be the house." />

    <!-- Preload critical font (Orbitron for display headings — first thing users read) -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/orbitron/v31/yMJMMIlzdpvBhQQL_SC3X9yhF25-T1ny_CmeoQ.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking font load: print→all swap trick -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Inline critical loading styles — shows skeleton BEFORE any JS executes -->
    <style>
      html, body { margin: 0; padding: 0; background: #08080f; }
      #loading-skeleton {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #08080f;
        font-family: 'Orbitron', sans-serif;
        transition: opacity 0.3s ease;
      }
      #loading-skeleton.fade-out { opacity: 0; pointer-events: none; }
      .sk-logo {
        width: 48px; height: 48px;
        border: 2px solid rgba(255,215,0,0.3);
        border-top-color: #ffd700;
        border-radius: 50%;
        animation: sk-spin 0.8s linear infinite;
      }
      .sk-text {
        margin-top: 16px;
        color: rgba(255,215,0,0.7);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      @keyframes sk-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .sk-logo { animation: none; border-color: #ffd700; }
      }
    </style>
  </head>
  <body>
    <!-- Instant loading skeleton — removed by React after hydration -->
    <div id="loading-skeleton">
      <div class="sk-logo"></div>
      <div class="sk-text">YOINK.GG</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Remove skeleton once React mounts (failsafe: 8s timeout) -->
    <script>
      (function() {
        var el = document.getElementById('loading-skeleton');
        if (!el) return;
        var observer = new MutationObserver(function() {
          if (document.getElementById('root').children.length > 0) {
            el.classList.add('fade-out');
            setTimeout(function() { el.remove(); }, 350);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
        // Failsafe: remove after 8s no matter what
        setTimeout(function() { if (el.parentNode) { el.classList.add('fade-out'); setTimeout(function() { el.remove(); }, 350); } }, 8000);
      })();
    </script>
  </body>
</html>
